<title>閱讀小顧問 Reading Advisor</title>
<style>
:root{--bg:#fbf7ef;--card:#ffffff;--ink:#2b2a33;--mute:#6d6a78;--line:#e7dfcf;--accent:#e8743b;--accent-ink:#ffffff;--soft:#fdeadd;--ok:#2f8f5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b22;--card:#27262f;--ink:#f1eee8;--mute:#a8a4b4;--line:#3a3946;--accent:#f08a54;--accent-ink:#1c1b22;--soft:#3a2d27;--ok:#59c48b}}
:root[data-theme="dark"]{--bg:#1c1b22;--card:#27262f;--ink:#f1eee8;--mute:#a8a4b4;--line:#3a3946;--accent:#f08a54;--accent-ink:#1c1b22;--soft:#3a2d27;--ok:#59c48b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;color:inherit}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
#lang{white-space:nowrap;margin-top:8px}
input[type=text]{width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.go{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;padding:14px;border-radius:14px;cursor:pointer}
.go.alt{background:var(--soft);color:var(--ink);margin-top:6px}
.msg{color:var(--mute);margin:10px 0 0;min-height:1.4em}
.book{border-left:5px solid var(--accent)}
.book h3{margin:0 0 2px;font-size:1.15rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.why{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
footer{color:var(--mute);font-size:.8rem;text-align:center;margin-top:20px}
</style>
</head>
<body>
<main>
<div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div><button class="opt" id="lang" aria-label="Language"></button></div>
<section><h2 id="h2a"></h2><div class="row" id="grades"></div></section>
<section><h2 id="h2b"></h2><div class="row" id="chips"></div><input type="text" id="free"></section>
<section><h2 id="h2c"></h2><div class="row" id="rl"></div></section>
<button class="go" id="go"></button>
<p class="msg" id="msg" role="status"></p>
<div id="out"></div>
<footer id="foot"></footer>
</main>

 tech:['See how technology shapes our lives.','Great for curious minds who love gadgets.'],
 food:['Learn to make something delicious!','Cooking tips and everyday know-how.'],
 nature:['Meet amazing animals and wild places.','Learn how to care for our planet.'],
 story:['A gripping story you will not want to put down.','Characters you will remember.'],
 english:['Real English to boost your reading.','Build vocabulary while enjoying a story.'],
 humor:['Read and laugh!','Perfect when you need a smile.'],
 lit:['Enjoy beautiful writing.','Great ideas for your own writing.']}
};
var OPEN = {zh:['你鍾意「X」，','啱晒「X」迷！','愛「X」嘅你，'], en:['You like X, so ','For X fans: ','If you enjoy X, ']};
var EXTRA = {zh:{1:'輕鬆易讀。',3:'有啲挑戰，但好有成就感。',v:'仲有續集！'}, en:{1:' A quick, easy read.',3:' A challenge, but worth it.',v:' There is more in the series!'}};
var KW = {
 mystery:['推理','偵探','懸疑','福爾摩斯','柯南','謎','mystery','detective','sherlock'],
 fantasy:['奇幻','魔','冒險','哈利','納尼亞','神話','龍','fantasy','magic','dragon','harry'],
 science:['科學','太空','宇宙','實驗','物理','化學','生物','恐龍','science','space','dinosaur'],
 history:['歷史','三國','水滸','西遊','古代','history'],
 comic:['漫畫','動漫','卡通','comic','manga','anime','cartoon'],
 sports:['運動','籃球','足球','體育','網球','游泳','武術','sport','football','basketball','soccer'],
 mind:['心理','成長','人生','情緒','朋友','feelings','friends','growing'],
 art:['藝術','畫','音樂','攝影','設計','電影','art','music','draw','movie'],
 travel:['旅遊','旅行','地理','世界','travel'],
 tech:['電腦','科技','機械','機器人','遊戲','發明','computer','tech','robot','game'],
 food:['美食','煮','烘焙','食','food','cook','baking'],
 nature:['動物','昆蟲','貓','狗','海洋','植物','自然','animal','cat','dog','ocean','nature'],
 humor:['搞笑','幽默','笑','funny','joke'],
 lit:['文學','詩','散文','poem','poetry'],
 story:['小說','故事','story','novel'],
 english:['英文','english']
};
var CHIPS = ['mystery','fantasy','science','history','comic','sports','mind','art','travel','tech','food','nature','story','english'];
var EMOJI = {mystery:'🔍',fantasy:'🐉',science:'🔬',history:'🏯',comic:'💥',sports:'🏀',mind:'💭',art:'🎨',travel:'🌏',tech:'💻',food:'🍳',nature:'🐾',story:'📖',english:'🔤'};
var RLS = ['both','C','E','easyC'];

function el(id){ return document.getElementById(id); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

function ui(){
  var t = S[L];
  document.documentElement.lang = L === 'zh' ? 'zh-Hant-HK' : 'en';
  el('h1').textContent = t.h1; el('sub').textContent = t.sub; el('h2a').textContent = t.a; el('h2b').textContent = t.b; el('h2c').textContent = t.c;
  el('free').placeholder = t.ph; el('go').textContent = t.go; el('lang').textContent = t.btn; el('foot').textContent = t.foot;
  var g = el('grades'); g.innerHTML = '';
  t.grade.forEach(function(name, i){
    var b = document.createElement('button'); b.className = 'opt'; b.textContent = name;
    b.setAttribute('aria-pressed', String(grade === i + 1));
    b.onclick = function(){ grade = i + 1; [].forEach.call(g.children, function(x, k){ x.setAttribute('aria-pressed', String(k === i)); }); };
    g.appendChild(b);
  });
  var c = el('chips'); c.innerHTML = '';
  CHIPS.forEach(function(k){
    var b = document.createElement('button'); b.className = 'opt';
    b.textContent = EMOJI[k] + ' ' + (L === 'zh' ? LABEL.zh[k] : LABEL.en[k].charAt(0).toUpperCase() + LABEL.en[k].slice(1));
    b.setAttribute('aria-pressed', String(!!picked[k]));
    b.onclick = function(){ picked[k] = !picked[k]; b.setAttribute('aria-pressed', String(!!picked[k])); };
    c.appendChild(b);
  });
  var r = el('rl'); r.innerHTML = '';
  RLS.forEach(function(k){
    var b = document.createElement('button'); b.className = 'opt'; b.textContent = t.rls[k];
    b.setAttribute('aria-pressed', String(rl === k));
    b.onclick = function(){ rl = k; [].forEach.call(r.children, function(x, i){ x.setAttribute('aria-pressed', String(RLS[i] === k)); }); };
    r.appendChild(b);
  });
}

function wants(){
  var w = {}, tokens = [];
  Object.keys(picked).forEach(function(k){ if (picked[k]) w[k] = 1; });
  el('free').value.toLowerCase().split(/[,，、;；\s]+/).forEach(function(tok){
    if (!tok) return;
    tokens.push(tok);
    Object.keys(KW).forEach(function(k){
      KW[k].forEach(function(x){ if (tok.indexOf(x) >= 0 || (tok.length > 2 && x.indexOf(tok) >= 0)) w[k] = 1; });
    });
  });
  return {tags: w, tokens: tokens};
}

function fit(lv){
  if (rl === 'easyC') return lv === 1 ? 4 : lv === 2 ? 1 : -6;
  if (grade <= 2) return lv === 1 ? 2 : lv === 2 ? 1 : -2;
  if (grade <= 4) return lv === 2 ? 2 : lv === 1 ? 1 : 0;
  return lv === 3 ? 2 : lv === 2 ? 1 : -1;
}

function reason(b, main){
  var t = main || b[4][0], h = pick(HOOK[L][t]), txt = h;
  if (main) txt = pick(OPEN[L]).replace('X', LABEL[L][t]) + h;
  var ex = b[8] > 1 ? EXTRA[L].v : (b[7] !== 2 ? EXTRA[L][b[7]] : '');
  if (ex && (L === 'en' || (txt + ex).length <= 50)) txt += ex;
  return txt;
}

function recommend(fresh){
  var t = S[L], msg = el('msg'), out = el('out');
  if (!grade){ msg.textContent = t.need; return; }
  var w = wants(), hasWish = Object.keys(w.tags).length + w.tokens.length > 0;
  if (fresh) shown = {};
  var scored = [];
  BOOKS.forEach(function(b, i){
    if (rl === 'C' || rl === 'easyC'){ if (b[2] !== 'C') return; }
    if (rl === 'E' && b[2] !== 'E') return;
    var s = 0, hit = 0, main = null;
    b[4].forEach(function(k){ if (w.tags[k]){ s += 3; hit++; if (!main) main = k; } });
    w.tokens.forEach(function(k){ if ((b[0] + b[1]).toLowerCase().indexOf(k) >= 0){ s += 4; hit++; } });
    s += fit(b[7]) + Math.random() * 2.5 + (b[4].indexOf('story') >= 0 ? 0.5 : 0) + (parseInt(b[5]) >= 2010 ? 0.7 : 0);
    if (shown[i]) s -= 50;
    scored.push({i: i, b: b, s: s, hit: hit, main: main});
  });
  scored.sort(function(a, c){ return c.s - a.s; });
  var top = scored.slice(0, 3);
  if (top.some(function(x){ return shown[x.i]; })){ shown = {}; return recommend(false); }
  var anyHit = top.some(function(x){ return x.hit > 0; });
  msg.textContent = hasWish && !anyHit ? t.none : (hasWish ? t.ok : t.rnd);
  out.innerHTML = '';
  top.forEach(function(x){
    shown[x.i] = 1;
    var b = x.b, card = document.createElement('section'); card.className = 'book';
    var h = document.createElement('h3'); h.textContent = (b[2] === 'E' ? b[0] : '《' + b[0] + '》') + (b[8] > 1 ? t.vols(b[8]) : '');
    var m = document.createElement('p'); m.className = 'meta';
    m.textContent = (b[1] ? b[1] + '  ' : '') + (b[5] && b[5].indexOf('[') < 0 ? b[5] + t.yr : '');
    var p = document.createElement('p'); p.className = 'why'; p.textContent = '💡 ' + reason(b, x.main);
    var tg = document.createElement('div'); tg.className = 'tags';
    [[b[2] === 'E' ? t.en : t.cn, 'ok'], [t.lv[b[7] - 1], ''], [t.loc + b[3], ''], [t.call + b[6], '']].forEach(function(a){
      var s = document.createElement('span'); s.className = 'tag ' + a[1]; s.textContent = a[0]; tg.appendChild(s);
    });
    card.appendChild(h); card.appendChild(m); card.appendChild(p); card.appendChild(tg); out.appendChild(card);
  });
  var again = document.createElement('button'); again.className = 'go alt'; again.textContent = t.again;
  again.onclick = function(){ recommend(false); }; out.appendChild(again);
  lastShown = true;
  out.scrollIntoView({behavior: 'smooth', block: 'start'});
}

el('go').onclick = function(){ recommend(true); };
el('lang').onclick = function(){ L = L === 'zh' ? 'en' : 'zh'; ui(); el('msg').textContent = ''; el('out').innerHTML = ''; };
ui();
</script>
</body>
</html>
